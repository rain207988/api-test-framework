# 商品域用例数据（查询类接口，无需登录）
# 断言依赖 seed.py 的确定性种子数据：10 件商品，id 1-10，
# id1=无线蓝牙耳机199.0，id4=机械键盘 87键，分类"电脑外设"有 3 件(id 4/5/6)

cases:
  - name: 默认查询第一页商品
    api: goods_list
    expect:
      status_code: 200
      code: 0
      fields:
        $.data.page: 1
        $.data.page_size: 5
        $.data.total: 10
        $.data.list[0].id: 1

  - name: 第二页每页三条
    api: goods_list
    params: { page: 2, page_size: 3 }
    expect:
      code: 0
      fields:
        $.data.page: 2
        $.data.total: 10
        $.data.list[0].id: 4     # 每页3条，第2页从id=4开始

  - name: 关键字命中一件商品
    api: goods_list
    params: { keyword: 耳机 }
    expect:
      code: 0
      fields:
        $.data.total: 1
        $.data.list[0].name: 无线蓝牙耳机

  - name: 关键字无命中返回空列表
    api: goods_list
    params: { keyword: 不存在的商品XYZ }
    expect:
      code: 0
      fields:
        $.data.total: 0

  - name: 分类过滤电脑外设
    api: goods_list
    params: { category: 电脑外设 }
    expect:
      code: 0
      fields:
        $.data.total: 3
        $.data.list[0].id: 4

  - name: 分类无命中返回空列表
    api: goods_list
    params: { category: 母婴用品 }
    expect:
      code: 0
      fields:
        $.data.total: 0

  - name: 每页一条取首页
    api: goods_list
    params: { page: 1, page_size: 1 }
    expect:
      code: 0
      fields:
        $.data.total: 10
        $.data.list[0].id: 1

  - name: 页码超出总数返回空列表
    api: goods_list
    params: { page: 99, page_size: 5 }
    expect:
      code: 0
      fields:
        $.data.total: 10

  - name: 页码为0时服务端容错为第1页
    api: goods_list
    params: { page: 0 }
    expect:
      code: 0
      fields:
        $.data.list[0].id: 1

  - name: 页码非法字符串报参数错误
    api: goods_list
    params: { page: abc }
    expect:
      code: 1004
      fields:
        $.message: page/page_size 必须是整数

  - name: 页大小非法字符串报参数错误
    api: goods_list
    params: { page_size: abc }
    expect:
      code: 1004

  - name: 商品详情成功
    api: goods_detail
    params: { goods_id: 1 }
    expect:
      status_code: 200
      code: 0
      fields:
        $.data.name: 无线蓝牙耳机
        $.data.price: 199.0
        # 注意：不断言 stock——链路用例会消耗库存，静态断言库存值必然脆弱。
        # 需要断言库存的场景放链路里做"消耗前/回补后"的闭环断言（见 chain_data.yaml）。

  - name: 商品详情不存在
    api: goods_detail
    params: { goods_id: 9999 }
    expect:
      code: 2001
      fields:
        $.message: 商品不存在或已下架

  - name: 商品详情id为0视为不存在
    api: goods_detail
    params: { goods_id: 0 }
    expect:
      code: 2001
